server.port=0

# ---- 任务调度与配额（默认配置，本地直接运行即可演示）----
# 每个提交主体的运行中资源配额上限（cpuUnits）
scheduler.default-quota=10
# 最大下发/执行次数：失败或超时回收达到此次数后任务终结为 ABANDONED
scheduler.max-attempts=3
# 租约有效期：超过该时间未回传结果即判定执行者失联，可被回收
scheduler.lease-ttl-millis=5000
# 租约回收器扫描间隔
scheduler.reaper-interval-millis=1000
# 本地执行者开关与节奏；测试环境在测试配置中关闭，避免后台干扰
scheduler.executor-enabled=true
scheduler.executor-interval-millis=500
# 本地执行者模拟单个任务的执行耗时
scheduler.execute-delay-millis=800
