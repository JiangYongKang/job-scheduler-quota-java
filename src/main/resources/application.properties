# 随机端口，避免本机端口冲突；需要固定端口可改为 8080
server.port=0

# ===== 调度 / 租约 / 重试 配置 =====
# 租约有效期（毫秒）；执行时长超过它的任务会被回收
scheduler.lease-ttl-ms=3000
# 每个任务最大尝试次数（含首次；3 = 首次 + 2 次重试）
scheduler.max-attempts=3
# 后台调度扫描间隔（毫秒）；<=0 关闭后台线程，改用 /api/admin/tick 手动驱动（默认关闭，结论可复现）
scheduler.tick-interval-ms=0
# 本地执行者数量与每个执行者的并发槽位
scheduler.local-executor.count=1
scheduler.local-executor.parallelism=4
# 同一任务最多被高优先级任务抢占的次数，达到后获得抢占免疫（防饿死）；0 表示关闭抢占
scheduler.max-preemptions-per-job=3

# 业务日志（调度判定依据 / 配额占用 / 任务标识）输出到控制台
logging.level.com.github.highcumontoa=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
